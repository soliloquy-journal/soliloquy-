<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed rounded badge background -->
  <rect width="512" height="512" rx="112" fill="#84C9A6"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#111111" stroke-width="18"/>

  <!-- Hard Neo-Brutalist Notebook Shadow -->
  <rect x="122" y="138" width="286" height="270" rx="28" fill="#111111"/>

  <!-- Open Folio Base -->
  <rect x="108" y="122" width="286" height="270" rx="28" fill="#FAF5E8" stroke="#111111" stroke-width="16"/>

  <!-- Center Spine -->
  <line x1="251" y1="126" x2="251" y2="388" stroke="#111111" stroke-width="14"/>

  <!-- Honey Bookmark Ribbon -->
  <path d="M312 122H354V232L333 212L312 232V122Z" fill="#E8C974" stroke="#111111" stroke-width="12" stroke-linejoin="round"/>

  <!-- Ruled Writing Lines (Left Page) -->
  <line x1="142" y1="192" x2="216" y2="192" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
  <line x1="142" y1="242" x2="216" y2="242" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
  <line x1="142" y1="292" x2="196" y2="292" stroke="#111111" stroke-width="14" stroke-linecap="round"/>

  <!-- Ruled Writing Lines & Spark (Right Page) -->
  <line x1="286" y1="292" x2="360" y2="292" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
  <circle cx="333" cy="340" r="14" fill="#DF9BB9" stroke="#111111" stroke-width="10"/>
</svg>
